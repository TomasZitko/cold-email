# ============================================================================
# COLD EMAIL OUTREACH SYSTEM - PRODUCTION CONFIG
# ============================================================================

# SYSTEM SETTINGS
system:
  version: "2.0.0"
  mode: "production"
  debug: false
  log_level: "INFO"

# LEAD PROCESSING
lead_processing:
  # Scoring thresholds (0-100)
  tiers:
    tier1_min: 85  # Top 5% - Personalized demo
    tier2_min: 70  # Top 20% - Mockup + portfolio
    tier3_min: 60  # Top 50% - Portfolio only
    # Below 60 = Don't email

  # Batch sizes
  batch_size: 1000
  max_workers: 20  # Concurrent processing threads

  # Auto-reject rules
  auto_reject:
    government: true
    large_corp_min_employees: 50
    recently_redesigned_months: 24
    permanently_closed: true

# NICHE DETECTION
niches:
  detection:
    # Keywords for automatic niche detection
    restaurant:
      keywords: [restaurace, restaurant, pizzerie, bistro, fastfood]
      template: restaurant
      priority_multiplier: 1.2

    hotel:
      keywords: [hotel, penzion, ubytování, accommodation, hostel]
      template: hotel
      priority_multiplier: 1.15

    cafe:
      keywords: [kavárna, café, cafe, cukrárna, coffee]
      template: cafe
      priority_multiplier: 1.2

    salon:
      keywords: [kadeřnictví, salon, barber, holič, beauty, kosmetika]
      template: salon
      priority_multiplier: 1.1

    fitness:
      keywords: [fitness, gym, posilovna, yoga, jóga]
      template: fitness
      priority_multiplier: 1.0

    retail:
      keywords: [obchod, boutique, butik, shop, prodejna]
      template: retail
      priority_multiplier: 0.9

    professional:
      keywords: [lawyer, advokát, účetní, architect, consultant]
      template: professional
      priority_multiplier: 0.8

    default:
      keywords: []
      template: default
      priority_multiplier: 1.0

# WEBSITE GENERATION
website_generation:
  # Template settings
  templates:
    base_path: "src/templates/"
    personalization:
      company_name: true
      location: true
      industry_specific: true
      color_scheme: true  # Auto-adjust based on niche
      images: false  # Don't modify images for now (complex)

  # Dynamic rendering
  rendering:
    mode: "dynamic"  # dynamic = URL params, static = files
    base_url: "https://tomaszitko.cz/demo/"  # Your domain
    url_format: "?lead={lead_id}"

  # Static file generation (backup)
  static:
    enabled: false
    output_dir: "data/generated_sites/"
    cleanup_days: 7

# HOSTING
hosting:
  provider: "cloudflare_pages"  # Options: cloudflare_pages, github_pages, vps

  # Cloudflare Pages settings
  cloudflare:
    account_id: ""  # Set via environment variable
    project_name: "cold-email-demos"
    api_token: ""  # Set via environment variable
    custom_domain: "tomaszitko.cz"
    auto_cleanup: true
    cleanup_days: 7

  # Alternative: Simple VPS
  vps:
    enabled: false
    host: ""
    ssh_key_path: ""
    web_root: "/var/www/demos/"

# EMAIL ORCHESTRATION
email:
  # SMTP settings (from environment variables)
  smtp:
    host: ""  # SMTP_HOST env var
    port: 587
    use_tls: true
    username: ""  # SMTP_USER env var
    password: ""  # SMTP_PASSWORD env var
    from_email: "info@tomaszitko.cz"
    from_name: "Tomáš Žitko"

  # Sending strategy
  sending:
    # Warm-up schedule (emails per day)
    warmup:
      enabled: true
      schedule:
        day_1_7: 20    # Week 1: 20/day
        day_8_14: 50   # Week 2: 50/day
        day_15_21: 100 # Week 3: 100/day
        day_22_plus: 200  # Week 4+: 200/day

    # Rate limiting
    rate_limit:
      emails_per_hour: 30
      delay_between_emails_seconds: 120  # 2 minutes
      randomize_delay: true
      randomize_range_seconds: 60  # +/- 60s

    # Batch management
    batches:
      tier1_daily_limit: 10   # Personalized demos (high effort)
      tier2_daily_limit: 30   # Mockups
      tier3_daily_limit: 60   # Portfolio only

    # Retry logic
    retry:
      max_attempts: 3
      backoff_multiplier: 2

  # Templates
  templates:
    base_path: "src/email_templates/"
    tier1: "tier1_personalized_demo.txt"
    tier2: "tier2_mockup_portfolio.txt"
    tier3: "tier3_portfolio.txt"

  # Personalization
  personalization:
    company_name: true
    industry_specific: true
    website_issues: true  # Mention specific problems found
    local_references: true  # "Prague-based" etc.

# COMPLIANCE
compliance:
  # Unsubscribe
  unsubscribe:
    enabled: true
    link_format: "https://tomaszitko.cz/unsubscribe?id={lead_id}"
    list_file: "data/compliance/unsubscribe_list.json"

  # GDPR
  gdpr:
    enabled: true
    data_retention_days: 365
    export_format: "json"

  # Bounce handling
  bounce:
    enabled: true
    max_bounces: 2
    blacklist_file: "data/compliance/bounce_blacklist.json"

  # Spam complaints
  spam:
    enabled: true
    complaint_file: "data/compliance/spam_complaints.json"
    auto_blacklist: true

# ANALYTICS
analytics:
  # Tracking
  tracking:
    enabled: true
    track_opens: true
    track_clicks: true
    track_demo_views: true
    track_time_on_page: true

  # Data storage
  storage:
    database_file: "data/analytics/tracking.db"
    format: "sqlite"  # Simple, no external DB needed

  # Reporting
  reporting:
    enabled: true
    daily_summary: true
    weekly_report: true
    output_dir: "data/analytics/reports/"

  # Metrics
  metrics:
    - open_rate
    - click_rate
    - demo_view_rate
    - reply_rate
    - conversion_rate
    - time_to_reply
    - best_performing_tier
    - best_performing_niche

# LOGGING
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  files:
    main: "logs/system.log"
    errors: "logs/errors.log"
    analytics: "logs/analytics.log"
    email_sent: "logs/emails_sent.log"

  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5

# DATA PATHS
paths:
  input:
    leads: "data/leads/input/"
    templates: "src/templates/"
    email_templates: "src/email_templates/"

  output:
    processed_leads: "data/leads/processed/"
    generated_sites: "data/generated_sites/"
    emails_queue: "data/emails/queue/"
    emails_sent: "data/emails/sent/"

  cache:
    website_analysis: "data/cache/website_analysis.json"
    lead_scores: "data/cache/lead_scores.json"

  compliance:
    unsubscribe: "data/compliance/unsubscribe_list.json"
    bounces: "data/compliance/bounce_blacklist.json"
    spam: "data/compliance/spam_complaints.json"

# PERFORMANCE
performance:
  cache:
    enabled: true
    ttl_days: 7

  threading:
    enabled: true
    max_workers: 20

  timeouts:
    website_check_seconds: 10
    email_send_seconds: 30
    api_call_seconds: 15
