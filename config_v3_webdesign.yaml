# ============================================================================
# 3. BUSINESS MATURITY SCORING (20 points max)
# ============================================================================
# Combines age, revenue indicators, and growth signals

business_maturity:
  # Revenue proxy indicators (since actual revenue often unavailable)
  revenue_indicators:
    # Employee count as revenue proxy
    employee_ranges:
      - min: 10
        max: 50
        points: 10
        estimated_revenue: "100k-500k"
        quality: "IDEAL - can afford $5k+ projects"

      - min: 5
        max: 9
        points: 7
        estimated_revenue: "50k-100k"
        quality: "GOOD - can afford $3k+ projects"

      - min: 3
        max: 4
        points: 5
        estimated_revenue: "30k-50k"
        quality: "OK - can afford $2k+ projects"

      - min: 1
        max: 2
        points: 2
        estimated_revenue: "<30k"
        quality: "RISKY - limited budget"

      - min: 51
        max: 200
        points: 6
        estimated_revenue: "500k-2M"
        quality: "GOOD - but may have in-house"

      - min: 201
        max: 999999
        points: 3
        estimated_revenue: "2M+"
        quality: "LIKELY has in-house team"

    # Multiple locations (indicator of success)
    multi_location_bonus:
      - locations: 2
        bonus_points: 5
        signal: "Expanding - proven model"

      - locations: 3-5
        bonus_points: 8
        signal: "Successful chain - high budget"

      - locations: 6+
        bonus_points: 4
        signal: "Corporate - may have centralized marketing"

    # Online presence quality (paradox: good social + bad website = opportunity)
    online_presence_score:
      active_google_business:
        points: 3
        signal: "Cares about online presence"

      many_reviews:
        threshold: 20
        points: 4
        signal: "Established reputation"

      active_social_no_website:
        points: 10
        signal: "GOLDEN - understands marketing, needs website"

      active_social_bad_website:
        points: 7
        signal: "EXCELLENT - ready for upgrade"

  # Industry certifications/memberships (signals professionalism & budget)
  professional_signals:
    chamber_of_commerce:
      points: 2
      signal: "Invested in business community"

    industry_association:
      points: 3
      signal: "Professional standards"

    certifications:
      points: 4
      signal: "Quality-focused, willing to invest"

# ============================================================================
# 4. WEBSITE ISSUES SCORING (15 points max) - REDUCED WEIGHT
# ============================================================================
# Issues matter, but less than industry tier and redesign timing

website_issues:
  critical_issues:
    no_ssl: 5              # Security concern
    flash_detected: 5      # Completely outdated
    not_mobile: 4          # Mobile-first era
    frameset: 5            # Ancient technology

  major_issues:
    old_copyright: 3       # <= 2020
    slow_load: 3           # > 5 seconds
    broken_links: 3        # 3+ broken
    table_layout: 3        # Old layout method
    no_responsive_css: 3   # No @media queries

  minor_issues:
    missing_h1: 1
    missing_meta_desc: 1
    poor_seo: 2

  # Modern website PENALTY (they don't need help)
  modern_website_penalty:
    all_modern_indicators: -10    # SSL + mobile + responsive + fast
    signal: "Recently redesigned - SKIP"

# ============================================================================
# 5. ENGAGEMENT SIGNALS (5 points max)
# ============================================================================
engagement_signals:
  social_media_activity:
    instagram_active: 2
    facebook_active: 2
    linkedin_active: 1

  review_presence:
    google_reviews_20plus: 3
    recent_reviews: 2            # Within 30 days

  content_freshness:
    blog_updated_recently: 2
    news_section_active: 1

# ============================================================================
# BUSINESS STATUS DETECTION - NEW FEATURE
# ============================================================================
business_status:
  # Google Business Profile status
  check_methods:
    - google_business_api
    - google_maps_scrape
    - website_check

  status_types:
    permanently_closed:
      auto_reject: true
      rejection_reason: "Business permanently closed"

    temporarily_closed:
      reduce_score: 50          # Reduce score by 50%
      warning: "Temporarily closed - verify before outreach"

    open:
      no_penalty: true

    unknown:
      assume_open: true          # Benefit of the doubt

  # Website indicators of closure
  closure_indicators:
    keywords:
      - "permanently closed"
      - "out of business"
      - "no longer operating"
      - "closed down"
      - "zavřeno natrvalo"
      - "ukončili jsme činnost"

    website_offline:
      consecutive_checks: 3      # Must fail 3 times
      penalty: "Website offline - likely closed"

# ============================================================================
# AUTO-REJECT RULES - ENHANCED
# ============================================================================
auto_reject:
  # Government entities
  government:
    keywords:
      - ministerstvo
      - úřad
      - státní
      - municipality
      - obec
      - město
      - kraj
      - government
    exceptions:
      - soukromá škola
      - private school
      - soukromá klinika

  # Holding companies & investment firms
  holding:
    keywords:
      - holding
      - investment fund
      - investiční fond
      - venture capital
    max_employees: 2

  # Pure B2B manufacturing/wholesale
  b2b_manufacturing:
    keywords:
      - velkoobchod
      - wholesale
      - výroba
      - manufacturing
      - sklad
      - warehouse
      - distributor
      - distribution center
      - logistics
      - logistika

  # No contact info
  no_contact:
    enabled: true

  # Recently redesigned (modern website in last 2 years)
  recently_redesigned:
    enabled: true
    indicators:
      - modern_design_all_indicators
      - copyright_year_current
      - new_domain_registration        # < 2 years old

  # DIY free platforms (unlikely to convert)
  diy_free_platforms:
    enabled: true
    platforms:
      - "wix.com/free"
      - "weebly.com"
      - "wordpress.com"               # NOT .org
      - "webnode.cz/free"
      - "carrd.co"
    note: "DIY free users typically won't pay for professional design"

  # Permanently closed businesses
  permanently_closed:
    enabled: true
    auto_reject: true

  # Franchise with no local autonomy
  corporate_franchise:
    keywords:
      - "corporate website only"
      - "see main franchise site"
    note: "No local marketing budget"

# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================
performance:
  threading:
    enabled: true
    max_workers: 50
    rate_limit_delay: 0.1

  cache:
    enabled: true
    cache_file: data/analysis_cache_v3.json
    ttl_days: 7

  resume:
    enabled: true
    checkpoint_file: data/checkpoint_v3.json
    checkpoint_interval: 100

  progress:
    show_progress_bar: true
    log_level: INFO

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================
output:
  files:
    high_priority: data/HIGH_PRIORITY_LEADS_V3.csv
    medium_priority: data/MEDIUM_PRIORITY_LEADS_V3.csv
    low_priority: data/LOW_PRIORITY_LEADS_V3.csv
    rejected: data/REJECTED_LEADS_V3.csv
    statistics: data/STATISTICS_REPORT_V3.txt
    error_log: data/errors_v3.log

  csv:
    encoding: utf-8-sig
    delimiter: ","
    quoting: minimal

  columns:
    - company_name
    - score
    - conversion_probability      # NEW: Estimated conversion %
    - avg_project_value           # NEW: Estimated project value
    - industry_tier               # NEW: Which tier (1-9)
    - redesign_probability        # NEW: Redesign timing score
    - business_maturity_score     # NEW: Maturity indicators
    - email
    - phone
    - website
    - website_issues
    - website_age_years           # NEW
    - business_age_years          # NEW
    - employees
    - estimated_revenue           # NEW: Based on proxies
    - social_media_presence
    - google_reviews_count        # NEW
    - business_status             # NEW: Open/Closed
    - priority
    - notes

  statistics:
    - total_leads_processed
    - leads_rejected_count
    - rejection_reasons_breakdown
    - score_distribution
    - industry_tier_distribution  # NEW
    - avg_conversion_probability  # NEW
    - total_pipeline_value        # NEW: Sum of (count * avg_project_value)
    - top_20_leads                # Increased from 10

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: INFO
  format: "%(asctime)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

  files:
    main: logs/lead_filter_v3.log
    errors: logs/errors_v3.log
    debug: logs/debug_v3.log

  rotation:
    enabled: true
    max_bytes: 10485760
    backup_count: 5
