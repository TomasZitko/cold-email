# ============================================================================
# LEAD FILTERING CONFIGURATION V3 - WEB DESIGN CONVERSION OPTIMIZATION
# Based on Web Designer Industry Research & Best Practices
# ============================================================================
#
# PHILOSOPHY SHIFT: Quality > Quantity
# - Target 10-15% conversion rate (vs 2-3% unqualified)
# - Focus on $8k-$15k project value clients
# - Prioritize B2B professional services
# - 3-5 year business age sweet spot (redesign cycle)
# - Revenue $100k+ annually
#
# ============================================================================

# SCORING THRESHOLDS (0-100 scale)
# Adjusted for conversion probability, not just website quality
scoring:
  high_priority_min: 70      # Score 70-100: PURSUE ACTIVELY (10-15% conversion)
  medium_priority_min: 50    # Score 50-69: QUALIFIED PROSPECTS (5-10% conversion)
  low_priority_max: 49       # Score 0-49: NURTURE/LOW PRIORITY (2-5% conversion)

  # Maximum points per category (REWEIGHTED based on research)
  max_redesign_probability: 30   # NEW: Likelihood they need redesign NOW
  max_industry_tier: 30          # INCREASED: Industry = budget & conversion
  max_business_maturity: 20      # REFRAMED: Age + revenue indicators
  max_website_issues: 15         # REDUCED: Issues matter less than niche
  max_engagement_signals: 5      # NEW: Social media, reviews, activity

# ============================================================================
# 1. REDESIGN PROBABILITY SCORING (30 points max) - HIGHEST WEIGHT
# ============================================================================
# Based on research: Websites redesigned every 3-5 years
# Sweet spot: 3-5 year old businesses OR 3-5 year old websites

redesign_probability:
  # Website age scoring (from domain registration or last major update)
  website_age_scoring:
    - min_years: 3
      max_years: 5
      points: 30            # PERFECT: Due for redesign
      probability: "VERY HIGH"

    - min_years: 5
      max_years: 7
      points: 25            # EXCELLENT: Overdue for redesign
      probability: "HIGH"

    - min_years: 2
      max_years: 3
      points: 15            # GOOD: Approaching redesign cycle
      probability: "MEDIUM"

    - min_years: 7
      max_years: 10
      points: 20            # GOOD: Very outdated
      probability: "MEDIUM-HIGH"

    - min_years: 0
      max_years: 2
      points: 0             # BAD: Recently redesigned
      probability: "VERY LOW"

    - min_years: 10
      max_years: 99
      points: 10            # MAYBE: Ancient (might not care)
      probability: "LOW-MEDIUM"

  # Business age (if website age unknown, use business age as proxy)
  business_age_scoring:
    - min_months: 36        # 3 years
      max_months: 60        # 5 years
      points: 25            # EXCELLENT: Likely on original website
      notes: "Prime redesign window"

    - min_months: 60        # 5 years
      max_months: 120       # 10 years
      points: 20            # GOOD: Established, likely outdated site
      notes: "Proven business, outdated presence"

    - min_months: 24        # 2 years
      max_months: 36        # 3 years
      points: 12            # OK: Approaching window
      notes: "Watch for redesign signals"

    - min_months: 12        # 1 year
      max_months: 24        # 2 years
      points: 5             # LOW: Recently launched
      notes: "Too new, likely has site"

    - min_months: 0
      max_months: 12
      points: 0             # AVOID: Brand new
      notes: "Startup - limited budget"

    - min_months: 120       # 10+ years
      max_months: 999999
      points: 8             # MAYBE: If no website, won't get one
      notes: "Check if they have website"

  # Redesign signals (ADD bonus points if detected)
  redesign_signals:
    old_copyright_year:
      threshold: 2020       # Copyright year <= 2020
      bonus_points: 8
      signal: "Outdated copyright = neglected site"

    flash_or_deprecated_tech:
      bonus_points: 10
      signal: "Flash/tables = urgent redesign need"

    not_mobile_friendly:
      bonus_points: 8
      signal: "Mobile-first is critical now"

    broken_ssl:
      bonus_points: 10
      signal: "Security issue = urgent"

    slow_load_time:
      threshold_seconds: 5
      bonus_points: 5
      signal: "Poor UX = losing customers"

    template_site_detected:
      # Wix, Weebly, Squarespace, WordPress.com free
      platforms: ["wix", "weebly", "squarespace", "wordpress.com", "webnode"]
      bonus_points: 12
      signal: "DIY site = ready for professional help"

    broken_links_images:
      threshold: 3
      bonus_points: 6
      signal: "Neglected site = owner aware of issues"

    competitor_comparison:
      # If competitors have better sites
      bonus_points: 10
      signal: "Falling behind competition"

# ============================================================================
