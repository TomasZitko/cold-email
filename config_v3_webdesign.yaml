      - accounting firm
      - daňový poradce
      - tax advisor
      - finanční poradce
      - financial advisor
      - investiční poradce
      - wealth management
      - auditor

      # Medical & Healthcare (Private practices ONLY)
      - zubní ordinace
      - zubní klinika
      - dental
      - stomatologie
      - lékařská ordinace
      - private clinic
      - soukromá klinika
      - med spa
      - medical spa
      - veterina
      - veterinární klinika
      - chiropraktik
